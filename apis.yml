aid: vivrelle
name: Vivrelle
description: 'Vivrelle is a New York City based members-only club, founded in 2018, that
  lends luxury accessories — designer handbags, fine and designer jewelry, watches and
  diamonds from houses including Chanel, Hermès, Louis Vuitton, Gucci, Dior and Van Cleef
  & Arpels — to members for a recurring monthly fee rather than selling them. Membership
  is sold in published consumer tiers (Classique, Couture, Classique+, Couture+, plus the
  Premier and invite-only Réservé add-ons), and the product reaches members through
  vivrelle.com and a first-party iOS/Android app that includes "Ella AI", an AI styling
  tool built with Revolve and FWRD. Vivrelle is a direct-to-consumer subscription retail
  business, not a software vendor: it publishes no developer portal, no API documentation,
  no OpenAPI/GraphQL/AsyncAPI contract, no SDK in any public package registry, and no
  webhook or MCP surface. Its GitHub organization exists but carries zero public
  repositories, and its application backend is private to its own web and mobile clients.'
