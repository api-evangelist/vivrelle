  state: none
  reason: no-developer-program
  detail: >-
    Vivrelle is a direct-to-consumer luxury-accessory rental membership club that clearly
    builds software — a Next.js storefront, an iOS/Android app, and the "Ella AI" styling
    tool built with Revolve and FWRD — but ships all of it strictly as an end-user product:
    api.vivrelle.com does not resolve at all, every contract path on www.vivrelle.com
    (/openapi.json, /swagger.json, /graphql, /api-docs, /developers, /llms.txt) returns a
    genuine Next.js 404, all nine well-known paths 404 on every reachable host, no
    first-party package exists on npm, PyPI, RubyGems or crates.io, and the company's own
    GitHub organization has zero public repositories, so the only backend is the private
    Next.js /api namespace that robots.txt disallows and that serves Vivrelle's own clients.
